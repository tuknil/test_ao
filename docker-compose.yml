name: agentic-overlay

services:
  api:
    container_name: ingestion-server
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    ports:
      - "8081:8080" # optional: hit the API directly for debugging
    volumes:
      - pgdata:/app/pgvolume

  ui:
    container_name: ui-server
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
